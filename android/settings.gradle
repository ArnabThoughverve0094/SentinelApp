pluginManagement {
    // Include React Native Gradle Plugin from node_modules
    includeBuild(file("node_modules/@react-native/gradle-plugin"))

    // Include Expo Modules Autolinking plugin from node_modules
    def expoAutolinkingPath = file("node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
    if (expoAutolinkingPath.exists()) {
        includeBuild(expoAutolinkingPath)
    } else {
        println("Warning: Expo Gradle plugin not found at $expoAutolinkingPath")
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
        ex.autolinkLibrariesFromCommand()
    } else {
        ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
    }
}

expoAutolinking.useExpoModules()
expoAutolinking.useExpoVersionCatalog()

rootProject.name = 'frontend'
include ':app'
